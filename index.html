<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drilling Toolbox - حاسبة معدات الحفر</title>
<style>
:root {
--bg-main: #0f172a;
--bg-card: #1e293b;
--bg-input: #0f172a;
--border-color: #334155;
--text-main: #e2e8f0;
--text-muted: #94a3b8;
--accent: #38bdf8;
--accent-text: #0f172a;
--success: #22c55e;
--danger: #ef4444;
--warning: #f59e0b;
}
body.light-mode {
--bg-main: #f1f5f9;
--bg-card: #ffffff;
--bg-input: #f8fafc;
--border-color: #cbd5e1;
--text-main: #1e293b;
--text-muted: #64748b;
--accent: #0284c7;
--accent-text: #ffffff;
}
* { box-sizing: border-box; }
body {
font-family: 'Segoe UI', Arial, sans-serif;
background-color: var(--bg-main);
color: var(--text-main);
padding: 12px;
margin: 0;
min-height: 100vh;
transition: background-color 0.3s, color 0.3s;
}
h1 {
color: var(--accent);
text-align: center;
font-size: 20px;
margin: 10px 0 15px 0;
}
.top-bar {
display: flex;
gap: 4px;
margin-bottom: 10px;
background-color: var(--bg-card);
padding: 5px;
border-radius: 10px;
}
.theme-btn, .lang-btn {
flex: 1;
padding: 8px 4px;
border: 2px solid transparent;
border-radius: 6px;
background-color: var(--border-color);
color: var(--text-muted);
font-size: 12px;
font-weight: bold;
cursor: pointer;
}
.theme-btn.active, .lang-btn.active {
background-color: var(--accent);
color: var(--accent-text);
}
.tab-switcher {
display: flex;
gap: 4px;
margin-bottom: 12px;
background-color: var(--bg-card);
padding: 5px;
border-radius: 10px;
overflow-x: auto;
}
.tab-btn {
flex: 1;
padding: 10px 8px;
border: 2px solid transparent;
border-radius: 8px;
background-color: var(--border-color);
color: var(--text-muted);
font-size: 11px;
font-weight: bold;
cursor: pointer;
white-space: nowrap;
min-width: 70px;
}
.tab-btn.active {
background-color: var(--accent);
color: var(--accent-text);
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.card {
background-color: var(--bg-card);
border-radius: 12px;
padding: 15px;
margin-bottom: 12px;
border-right: 4px solid var(--accent);
}
html[dir="ltr"] .card {
border-right: none;
border-left: 4px solid var(--accent);
}
.card-title {
color: var(--accent);
font-size: 15px;
font-weight: bold;
margin-bottom: 10px;
border-bottom: 1px solid var(--border-color);
padding-bottom: 8px;
}
label {
display: block;
margin-top: 8px;
margin-bottom: 4px;
font-size: 12px;
color: var(--text-muted);
}
input, select {
width: 100%;
padding: 10px;
border-radius: 8px;
border: 1px solid var(--border-color);
background-color: var(--bg-input);
color: var(--text-main);
font-size: 14px;
}
input:focus, select:focus { outline: none; border-color: var(--accent); }
option { background-color: var(--bg-input); color: var(--text-main); }
.row { display: flex; gap: 8px; }
.row > div { flex: 1; }
.btn {
padding: 12px;
border: none;
border-radius: 8px;
font-size: 14px;
font-weight: bold;
cursor: pointer;
margin-top: 8px;
}
.btn-primary { background-color: var(--accent); color: var(--accent-text); }
.btn-success { background-color: var(--success); color: #fff; }
.btn-danger { background-color: var(--danger); color: #fff; }
.btn-secondary { background-color: #475569; color: #fff; }
.btn-row { display: flex; gap: 6px; margin-top: 10px; }
.btn-row .btn { flex: 1; margin-top: 0; }
.table-wrapper {
overflow-x: auto;
margin-top: 10px;
border-radius: 8px;
border: 1px solid var(--border-color);
}
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
th {
background-color: var(--bg-input);
color: var(--accent);
padding: 8px 4px;
text-align: center;
font-weight: bold;
border-bottom: 2px solid var(--accent);
font-size: 11px;
}
td {
padding: 7px 4px;
border-bottom: 1px solid var(--border-color);
text-align: center;
color: var(--text-main);
}
tr:nth-child(even) { background-color: rgba(0, 0, 0, 0.05); }
body:not(.light-mode) tr:nth-child(even) { background-color: rgba(15, 23, 42, 0.5); }
.result-row {
display: flex;
justify-content: space-between;
padding: 8px 0;
border-bottom: 1px solid var(--border-color);
font-size: 13px;
}
.result-row:last-child { border-bottom: none; }
.result-label { color: var(--text-muted); }
.result-value { font-weight: bold; color: var(--accent); }
</style>
</head>
<body>

<h1>🛢️ Drilling Toolbox</h1>

<div class="top-bar">
<button class="theme-btn active" onclick="setTheme('dark')" id="theme-dark">🌙</button>
<button class="theme-btn" onclick="setTheme('light')" id="theme-light">☀️</button>
</div>

<div class="top-bar">
<button class="lang-btn active" onclick="setLanguage('ar')" id="btn-ar">🇩🇿 AR</button>
<button class="lang-btn" onclick="setLanguage('en')" id="btn-en">🇬🇧 EN</button>
<button class="lang-btn" onclick="setLanguage('fr')" id="btn-fr">🇫🇷 FR</button>
</div>

<div class="tab-switcher">
<button class="tab-btn active" onclick="switchTab('database')" id="tab-db-btn">🔧 <span data-i18n="tabDb">Database</span></button>
<button class="tab-btn" onclick="switchTab('calculators')" id="tab-calc-btn">🧮 <span data-i18n="tabCalc">Calculators</span></button>
<button class="tab-btn" onclick="switchTab('camera')" id="tab-cam-btn">📷 <span data-i18n="tabCam">Camera</span></button>
<button class="tab-btn" onclick="switchTab('export')" id="tab-exp-btn">📤 <span data-i18n="tabExp">Export</span></button>
</div>

<div class="tab-content active" id="tab-database">
<div class="card">
<div class="card-title" data-i18n="dbTitle">🔧 Tool Database</div>
<label data-i18n="searchLabel">Search:</label>
<input type="text" id="searchInput" placeholder="..." oninput="filterDatabase()">
<div class="row" style="margin-top:10px;">
<div>
<label data-i18n="filterType">Type:</label>
<select id="filterType" onchange="filterDatabase()">
<option value="all" data-i18n="allTypes">All Types</option>
<option value="DP">Drill Pipe</option>
<option value="HWDP">HWDP</option>
<option value="DC">Drill Collar</option>
<option value="Stab">Stabilizer</option>
<option value="XO">Crossover</option>
</select>
</div>
<div>
<label data-i18n="filterUnit">Units:</label>
<select id="unitSystem" onchange="filterDatabase()">
<option value="metric">Metric (L/m)</option>
<option value="imperial">Imperial (bbl/ft)</option>
</select>
</div>
</div>
<div class="table-wrapper" style="margin-top:10px;">
<table id="toolsTable">
<thead>
<tr>
<th>#</th>
<th data-i18n="colType">Type</th>
<th data-i18n="colSize">Size</th>
<th>OD</th>
<th>ID</th>
<th data-i18n="colWeight">Weight</th>
<th data-i18n="colCapacity">Capacity</th>
<th data-i18n="colDisplacement">Displacement</th>
</tr>
</thead>
<tbody id="toolsBody"></tbody>
</table>
</div>
</div>
</div>

<div class="tab-content" id="tab-calculators">
<div class="card">
<div class="card-title" data-i18n="calcTitle">🧮 Quick Calculators</div>
<label data-i18n="calcSelect">Select Calculator:</label>
<select id="calcType" onchange="showCalculator()">
<option value="string_weight">String Weight</option>
<option value="buoyed">Buoyed Weight</option>
<option value="capacity">Capacity</option>
<option value="displacement">Displacement</option>
<option value="annular">Annular Volume</option>
</select>
<div id="calcContent" style="margin-top:15px;"></div>
</div>
</div>

<div class="tab-content" id="tab-camera">
<div class="card">
<div class="card-title" data-i18n="camTitle">📷 Camera</div>
<label data-i18n="camTake">Take Photo:</label>
<input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">
<div id="photoPreview" style="margin-top:10px;"></div>
</div>
</div>

<div class="tab-content" id="tab-export">
<div class="card">
<div class="card-title" data-i18n="expTitle">📤 Export Data</div>
<button class="btn btn-primary" onclick="exportPDF()">📄 PDF</button>
<button class="btn btn-success" onclick="exportExcel()">📊 Excel</button>
<button class="btn btn-secondary" onclick="exportImage()">📸 Image</button>
</div>
</div>

<script>
  // ============ الترجمات ============
const translations = {
ar: {
tabDb: "قاعدة البيانات", tabCalc: "الحاسبات", tabCam: "الكاميرا", tabExp: "التصدير",
dbTitle: "🔧 قاعدة بيانات المعدات", searchLabel: "البحث:",
filterType: "النوع:", allTypes: "كل الأنواع",
filterUnit: "الوحدات:",
colType: "النوع", colSize: "الحجم", colWeight: "الوزن",
colCapacity: "السعة", colDisplacement: "الإزاحة",
calcTitle: "🧮 الحاسبات السريعة", calcSelect: "اختر الحاسبة:",
camTitle: "📷 الكاميرا", camTake: "التقط صورة:",
expTitle: "📤 تصدير البيانات"
},
en: {
tabDb: "Database", tabCalc: "Calculators", tabCam: "Camera", tabExp: "Export",
dbTitle: "🔧 Tool Database", searchLabel: "Search:",
filterType: "Type:", allTypes: "All Types",
filterUnit: "Units:",
colType: "Type", colSize: "Size", colWeight: "Weight",
colCapacity: "Capacity", colDisplacement: "Displacement",
calcTitle: "🧮 Quick Calculators", calcSelect: "Select Calculator:",
camTitle: "📷 Camera", camTake: "Take Photo:",
expTitle: "📤 Export Data"
},
fr: {
tabDb: "Base de Données", tabCalc: "Calculateurs", tabCam: "Caméra", tabExp: "Exporter",
dbTitle: "🔧 Base de Données", searchLabel: "Rechercher:",
filterType: "Type:", allTypes: "Tous les Types",
filterUnit: "Unités:",
colType: "Type", colSize: "Taille", colWeight: "Poids",
colCapacity: "Capacité", colDisplacement: "Déplacement",
calcTitle: "🧮 Calculateurs Rapides", calcSelect: "Choisir:",
camTitle: "📷 Caméra", camTake: "Prendre une Photo:",
expTitle: "📤 Exporter les Données"
}
};

let currentLang = 'ar';
let currentTheme = 'dark';

// ============ ثوابت التحويل ============
const FT_TO_M = 0.3048;
const BBL_TO_L = 158.987;
const INCH_TO_MM = 25.4;
const LB_TO_KG = 0.453592;
const PPF_TO_KGM = 1.48816; // lb/ft to kg/m

// ============ قاعدة بيانات المعدات ============
const toolsDatabase = [
// Drill Pipe
{ type: 'DP', size: '2 3/8"', od: 2.375, id: 1.815, weight: 6.65, grade: 'E' },
{ type: 'DP', size: '2 7/8"', od: 2.875, id: 2.151, weight: 10.40, grade: 'E' },
{ type: 'DP', size: '3 1/2"', od: 3.500, id: 2.764, weight: 13.30, grade: 'E' },
{ type: 'DP', size: '3 1/2" (thick)', od: 3.500, id: 2.602, weight: 15.50, grade: 'E' },
{ type: 'DP', size: '4"', od: 4.000, id: 3.340, weight: 14.00, grade: 'E' },
{ type: 'DP', size: '4 1/2"', od: 4.500, id: 3.826, weight: 16.60, grade: 'E' },
{ type: 'DP', size: '4 1/2" (thick)', od: 4.500, id: 3.640, weight: 20.00, grade: 'E' },
{ type: 'DP', size: '5"', od: 5.000, id: 4.276, weight: 19.50, grade: 'E' },
{ type: 'DP', size: '5" (thick)', od: 5.000, id: 4.000, weight: 25.60, grade: 'E' },
{ type: 'DP', size: '5 1/2"', od: 5.500, id: 4.778, weight: 24.70, grade: 'E' },
// HWDP
{ type: 'HWDP', size: '3 1/2"', od: 3.500, id: 2.250, weight: 25.30, grade: 'E' },
{ type: 'HWDP', size: '4"', od: 4.000, id: 2.563, weight: 29.70, grade: 'E' },
{ type: 'HWDP', size: '4 1/2"', od: 4.500, id: 2.750, weight: 41.00, grade: 'E' },
{ type: 'HWDP', size: '5"', od: 5.000, id: 3.000, weight: 49.30, grade: 'E' },
{ type: 'HWDP', size: '5 1/2"', od: 5.500, id: 3.250, weight: 57.80, grade: 'E' },
// Drill Collar
{ type: 'DC', size: '4 1/8"', od: 4.125, id: 2.000, weight: 46.70, grade: 'E' },
{ type: 'DC', size: '4 3/4"', od: 4.750, id: 2.000, weight: 63.00, grade: 'E' },
{ type: 'DC', size: '6 1/4"', od: 6.250, id: 2.250, weight: 106.00, grade: 'E' },
{ type: 'DC', size: '6 1/2"', od: 6.500, id: 2.250, weight: 115.00, grade: 'E' },
{ type: 'DC', size: '6 1/2" (large ID)', od: 6.500, id: 2.813, weight: 105.00, grade: 'E' },
{ type: 'DC', size: '6 3/4"', od: 6.750, id: 2.250, weight: 124.00, grade: 'E' },
{ type: 'DC', size: '7"', od: 7.000, id: 2.250, weight: 134.00, grade: 'E' },
{ type: 'DC', size: '8"', od: 8.000, id: 2.813, weight: 170.00, grade: 'E' },
{ type: 'DC', size: '9 1/2"', od: 9.500, id: 3.000, weight: 240.00, grade: 'E' },
// Stabilizers
{ type: 'Stab', size: '6 1/8"', od: 6.125, id: 2.250, weight: 95.00, grade: '-' },
{ type: 'Stab', size: '6 1/2"', od: 6.500, id: 2.250, weight: 110.00, grade: '-' },
{ type: 'Stab', size: '8 1/2"', od: 8.500, id: 2.813, weight: 180.00, grade: '-' },
{ type: 'Stab', size: '12 1/4"', od: 12.250, id: 3.000, weight: 350.00, grade: '-' },
// Crossovers
{ type: 'XO', size: 'NC38-NC50', od: 4.750, id: 2.563, weight: 55.00, grade: '-' },
{ type: 'XO', size: 'NC46-NC50', od: 6.500, id: 2.750, weight: 110.00, grade: '-' }
];

// ============ الحسابات ============
function getCapacity(od, id, unit) {
if (unit === 'metric') {
// L/m
return Math.pow(id, 2) * (Math.PI / 4) * Math.pow(INCH_TO_MM, 2) * 1000 / 1000000;
} else {
// bbl/ft
return Math.pow(id, 2) / 1029.4;
}
}

function getDisplacement(od, id, unit) {
if (unit === 'metric') {
// L/m
return (Math.pow(od, 2) - Math.pow(id, 2)) * (Math.PI / 4) * Math.pow(INCH_TO_MM, 2) * 1000 / 1000000;
} else {
// bbl/ft
return (Math.pow(od, 2) - Math.pow(id, 2)) / 1029.4;
}
}

function getWeight(weight, unit) {
if (unit === 'metric') {
// kg/m
return weight * PPF_TO_KGM;
} else {
// lb/ft (ppf)
return weight;
}
}

// ============ عرض الجدول ============
function filterDatabase() {
const search = document.getElementById('searchInput').value.toLowerCase();
const filterType = document.getElementById('filterType').value;
const unit = document.getElementById('unitSystem').value;
const tbody = document.getElementById('toolsBody');

let filtered = toolsDatabase.filter(t => {
const matchSearch = !search || 
t.size.toLowerCase().includes(search) || 
t.type.toLowerCase().includes(search) ||
String(t.od).includes(search);
const matchType = filterType === 'all' || t.type === filterType;
return matchSearch && matchType;
});

if (filtered.length === 0) {
tbody.innerHTML = `<tr><td colspan="8" style="padding:20px;color:var(--text-muted);">No results</td></tr>`;
return;
}

let html = '';
filtered.forEach((t, i) => {
const cap = getCapacity(t.od, t.id, unit);
const disp = getDisplacement(t.od, t.id, unit);
const w = getWeight(t.weight, unit);
const capUnit = unit === 'metric' ? 'L/m' : 'bbl/ft';
const wUnit = unit === 'metric' ? 'kg/m' : 'lb/ft';
const ltrStyle = 'style="direction:ltr;unicode-bidi:embed;"';

html += `<tr>
<td>${i+1}</td>
<td>${t.type}</td>
<td ${ltrStyle}>${t.size}</td>
<td ${ltrStyle}>${t.od}"</td>
<td ${ltrStyle}>${t.id}"</td>
<td ${ltrStyle}>${w.toFixed(2)} ${wUnit}</td>
<td ${ltrStyle}>${cap.toFixed(4)} ${capUnit}</td>
<td ${ltrStyle}>${disp.toFixed(4)} ${capUnit}</td>
</tr>`;
});



tbody.innerHTML = html;
}

// ============ الحاسبات ============
function showCalculator() {
const calc = document.getElementById('calcType').value;
const content = document.getElementById('calcContent');

if (calc === 'string_weight') {
content.innerHTML = `
<label>Number of Joints:</label>
<input type="number" id="sw_joints" value="100" step="1" oninput="calcStringWeight()">
<label>Length per Joint (m):</label>
<input type="number" id="sw_length" value="9.5" step="0.1" oninput="calcStringWeight()">
<label>Weight (kg/m):</label>
<input type="number" id="sw_weight" value="30" step="0.1" oninput="calcStringWeight()">
<div style="margin-top:15px;" id="sw_result"></div>
`;
calcStringWeight();
} else if (calc === 'buoyed') {
content.innerHTML = `
<label>Air Weight (kg):</label>
<input type="number" id="bw_air" value="10000" step="1" oninput="calcBuoyed()">
<label>Mud Density (kg/L):</label>
<input type="number" id="bw_mud" value="1.2" step="0.01" oninput="calcBuoyed()">
<label>Steel Density (kg/L):</label>
<input type="number" id="bw_steel" value="7.85" step="0.01" oninput="calcBuoyed()">
<div style="margin-top:15px;" id="bw_result"></div>
`;
calcBuoyed();
} else if (calc === 'capacity') {
content.innerHTML = `
<label>ID (inch):</label>
<input type="number" id="cap_id" value="4.276" step="0.001" oninput="calcCapacity()">
<label>Length (m):</label>
<input type="number" id="cap_length" value="1000" step="1" oninput="calcCapacity()">
<div style="margin-top:15px;" id="cap_result"></div>
`;
calcCapacity();
} else if (calc === 'displacement') {
content.innerHTML = `
<label>OD (inch):</label>
<input type="number" id="dsp_od" value="5" step="0.001" oninput="calcDisplacement()">
<label>ID (inch):</label>
<input type="number" id="dsp_id" value="4.276" step="0.001" oninput="calcDisplacement()">
<label>Length (m):</label>
<input type="number" id="dsp_length" value="1000" step="1" oninput="calcDisplacement()">
<div style="margin-top:15px;" id="dsp_result"></div>
`;
calcDisplacement();
} else if (calc === 'annular') {
content.innerHTML = `
<label>Hole Diameter (inch):</label>
<input type="number" id="an_hole" value="8.5" step="0.001" oninput="calcAnnular()">
<label>Pipe OD (inch):</label>
<input type="number" id="an_od" value="5" step="0.001" oninput="calcAnnular()">
<label>Length (m):</label>
<input type="number" id="an_length" value="1000" step="1" oninput="calcAnnular()">
<div style="margin-top:15px;" id="an_result"></div>
`;
calcAnnular();
}
}

function calcStringWeight() {
const joints = parseFloat(document.getElementById('sw_joints').value) || 0;
const length = parseFloat(document.getElementById('sw_length').value) || 0;
const weight = parseFloat(document.getElementById('sw_weight').value) || 0;
const totalLength = joints * length;
const totalWeight = totalLength * weight;
document.getElementById('sw_result').innerHTML = `
<div class="result-row"><span class="result-label">Total Length:</span><span class="result-value">${totalLength.toFixed(2)} m</span></div>
<div class="result-row"><span class="result-label">Total Weight:</span><span class="result-value">${totalWeight.toFixed(2)} kg</span></div>
<div class="result-row"><span class="result-label">In Tons:</span><span class="result-value">${(totalWeight/1000).toFixed(3)} ton</span></div>
`;
}

function calcBuoyed() {
const air = parseFloat(document.getElementById('bw_air').value) || 0;
const mud = parseFloat(document.getElementById('bw_mud').value) || 0;
const steel = parseFloat(document.getElementById('bw_steel').value) || 0;
const bf = 1 - (mud / steel);
const buoyed = air * bf;
document.getElementById('bw_result').innerHTML = `
<div class="result-row"><span class="result-label">Buoyancy Factor:</span><span class="result-value">${bf.toFixed(4)}</span></div>
<div class="result-row"><span class="result-label">Buoyed Weight:</span><span class="result-value">${buoyed.toFixed(2)} kg</span></div>
<div class="result-row"><span class="result-label">In Tons:</span><span class="result-value">${(buoyed/1000).toFixed(3)} ton</span></div>
`;
}

function calcCapacity() {
const id = parseFloat(document.getElementById('cap_id').value) || 0;
const length = parseFloat(document.getElementById('cap_length').value) || 0;
const capPerM = getCapacity(id, id, 'metric');
const total = capPerM * length;
document.getElementById('cap_result').innerHTML = `
<div class="result-row"><span class="result-label">Capacity:</span><span class="result-value">${capPerM.toFixed(4)} L/m</span></div>
<div class="result-row"><span class="result-label">Total Volume:</span><span class="result-value">${total.toFixed(2)} L</span></div>
<div class="result-row"><span class="result-label">In m³:</span><span class="result-value">${(total/1000).toFixed(4)} m³</span></div>
`;
}

function calcDisplacement() {
const od = parseFloat(document.getElementById('dsp_od').value) || 0;
const id = parseFloat(document.getElementById('dsp_id').value) || 0;
const length = parseFloat(document.getElementById('dsp_length').value) || 0;
const dispPerM = getDisplacement(od, id, 'metric');
const total = dispPerM * length;
document.getElementById('dsp_result').innerHTML = `
<div class="result-row"><span class="result-label">Displacement:</span><span class="result-value">${dispPerM.toFixed(4)} L/m</span></div>
<div class="result-row"><span class="result-label">Total Displacement:</span><span class="result-value">${total.toFixed(2)} L</span></div>
<div class="result-row"><span class="result-label">In m³:</span><span class="result-value">${(total/1000).toFixed(4)} m³</span></div>
`;
}

function calcAnnular() {
const hole = parseFloat(document.getElementById('an_hole').value) || 0;
const od = parseFloat(document.getElementById('an_od').value) || 0;
const length = parseFloat(document.getElementById('an_length').value) || 0;
const annPerM = (Math.pow(hole, 2) - Math.pow(od, 2)) * (Math.PI / 4) * Math.pow(INCH_TO_MM, 2) * 1000 / 1000000;
const total = annPerM * length;
document.getElementById('an_result').innerHTML = `
<div class="result-row"><span class="result-label">Annular Capacity:</span><span class="result-value">${annPerM.toFixed(4)} L/m</span></div>
<div class="result-row"><span class="result-label">Total Annular Volume:</span><span class="result-value">${total.toFixed(2)} L</span></div>
<div class="result-row"><span class="result-label">In m³:</span><span class="result-value">${(total/1000).toFixed(4)} m³</span></div>
`;
}

// ============ الكاميرا ============
function handlePhoto(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
document.getElementById('photoPreview').innerHTML = `
<img src="${e.target.result}" style="width:100%;border-radius:8px;margin-top:10px;">
<button class="btn btn-success" onclick="savePhoto('${e.target.result}')">Save Photo</button>
`;
};
reader.readAsDataURL(file);
}

function savePhoto(dataUrl) {
try {
const photos = JSON.parse(localStorage.getItem('drilling_photos') || '[]');
photos.push({ url: dataUrl, date: new Date().toISOString() });
localStorage.setItem('drilling_photos', JSON.stringify(photos));
alert('✅ Photo saved!');
} catch (e) {
alert('Error: ' + e.message);
}
}

// ============ التنقل والإعدادات ============
function setLanguage(lang) {
currentLang = lang;
const t = translations[lang];
document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
document.getElementById('htmlRoot').setAttribute('lang', lang);
document.querySelectorAll('[data-i18n]').forEach(el => {
const key = el.getAttribute('data-i18n');
if (t[key]) el.textContent = t[key];
});
document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
document.getElementById('btn-' + lang).classList.add('active');
localStorage.setItem('drilling_lang', lang);
filterDatabase();
}

function setTheme(theme) {
currentTheme = theme;
if (theme === 'light') {
document.body.classList.add('light-mode');
} else {
document.body.classList.remove('light-mode');
}
document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
document.getElementById('theme-' + theme).classList.add('active');
localStorage.setItem('drilling_theme', theme);
}

function switchTab(tab) {
document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
document.getElementById('tab-' + tab).classList.add('active');
const btnMap = { database: 'tab-db-btn', calculators: 'tab-calc-btn', camera: 'tab-cam-btn', export: 'tab-exp-btn' };
document.getElementById(btnMap[tab]).classList.add('active');
}

// ============ التهيئة ============
window.addEventListener('DOMContentLoaded', () => {
const savedLang = localStorage.getItem('drilling_lang') || 'ar';
const savedTheme = localStorage.getItem('drilling_theme') || 'dark';
setTheme(savedTheme);
setLanguage(savedLang);
filterDatabase();
showCalculator();
});
